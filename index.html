<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compra TikTok Coins</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:url("./fondo.jpg");
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}

.formulario{

    width:430px;

    background:rgba(0,0,0,.60);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:35px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 0 40px rgba(0,0,0,.7);

}

h1{

    color:white;

    text-align:center;

    margin-bottom:10px;

    font-size:34px;

}

p{

    color:#ddd;

    text-align:center;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:15px;

    margin-bottom:18px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    background:linear-gradient(90deg,#ff0050,#00f2ea);

    color:white;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.03);

}

</style>

</head>

<body>

<div class="formulario">

<h1>Compra tus Monedas</h1>

<p>Completa tus datos para continuar.</p>

<form>

<input
type="text"
placeholder="Nombre completo"
required
>

<input
type="text"
placeholder="Número de tarjeta"
required
>

<input
type="text"
placeholder="Vencimiento"
required
>

<input
type="email"
placeholder="CVV: los 3 números de seguridad atrás de la tarjeta"
required
>

<button type="submit">
CONTINUAR
</button>

</form>

</div>

</body>

</html>
